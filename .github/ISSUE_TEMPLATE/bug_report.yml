name: App bug
description: Report a broken page, interaction, or local setup step.
title: "Bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page or command and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include browser or Node version when relevant. Remove credentials and private data from logs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: App version or commit
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private data, and runtime database files.
          required: true
