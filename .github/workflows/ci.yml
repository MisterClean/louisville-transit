name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, test, and app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 sharp
      - run: npm run lint --workspace apps/insights
      - run: npm run lint --workspace apps/alerts
      - run: npm test
      - run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag louisville-transit:ci .

  test:
    name: Test and build
    if: ${{ always() }}
    needs: [checks, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require app checks and container build
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          if [[ "$CHECKS_RESULT" != success || "$CONTAINER_RESULT" != success ]]; then
            echo "App checks: $CHECKS_RESULT; container build: $CONTAINER_RESULT"
            exit 1
          fi
