name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 sharp
      - run: npm run lint --workspace apps/insights
      - run: npm run lint --workspace apps/alerts
      - run: npm test
      - run: npm run build
      - run: docker build --tag louisville-transit:ci .
