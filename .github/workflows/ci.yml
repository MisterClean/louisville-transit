name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 sharp
      - run: npm run lint --workspace apps/insights
      - run: npm run lint --workspace apps/alerts
      - run: npm test
      - run: npm run build
